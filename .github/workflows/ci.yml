name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories get published against code that has not changed, so check the
  # dependencies on a timer as well as on pushes.
  schedule:
    - cron: '0 6 * * 1'

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, libxml, curl, fileinfo, bcmath, intl, zip, gd, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Written before composer install so the post-autoload artisan hooks
      # boot against a real config file rather than bare defaults.
      - name: Create .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # public/build is gitignored, and Blade templates call @vite, so the
      # manifest has to exist before any test renders a view. Building here
      # doubles as the guard against broken Vite/Tailwind config.
      - name: Build assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      # phpunit.xml pins the suite to sqlite :memory:, so no database service
      # is needed and nothing touches the real .env values.
      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, libxml, curl, fileinfo, bcmath, intl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Larastan boots the framework to resolve models and relations, so unlike
      # the formatting job this one needs the package:discover hook to run,
      # which in turn needs a config file to read.
      - name: Create .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # --no-scripts because a formatting check has no reason to boot the
      # framework: the post-autoload package:discover hook needs a .env this
      # job deliberately does not create, and pint only needs the autoloader.
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi --no-scripts

      - name: Check formatting
        run: vendor/bin/pint --test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # --locked audits composer.lock directly. This job installs nothing, and
      # without it composer has no installed set to read and exits 1.
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit JS dependencies
        run: npm audit --audit-level=high
